<!DOCTYPE html>
<html>
<head>
  <title>Cronómetro</title>
</head>
<body>
  <h1>Cronómetro</h1>
  <button id="startButton">Apartar</button>
  <p id="timer">2:00</p>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
  var startButton = document.getElementById('startButton');
  var timerElement = document.getElementById('timer');
  var startTime = localStorage.getItem('startTime');

  var duration = 2 * 60 * 1000; // 2 minutos en milisegundos

  if (startTime) {
    var elapsedTime = Date.now() - startTime;
    if (elapsedTime >= duration) {
      // El tiempo ha pasado, se reinicia el cronómetro
      localStorage.removeItem('startTime');
    } else {
      // El cronómetro aún está en marcha
      duration -= elapsedTime;
      startTimer();
    }
  }

  startButton.addEventListener('click', function() {
    // Guardar el tiempo de inicio en el almacenamiento local
    localStorage.setItem('startTime', Date.now());
    startTimer();
  });

  function startTimer() {
    startButton.disabled = true;

    var interval = setInterval(function() {
      duration -= 1000; // Restar 1 segundo
      var minutes = Math.floor(duration / (1000 * 60));
      var seconds = Math.floor((duration % (1000 * 60)) / 1000);

      // Formatear el tiempo como "MM:SS"
      var timeString = ('0' + minutes).slice(-2) + ':' + ('0' + seconds).slice(-2);
      timerElement.textContent = timeString;

      if (duration <= 0) {
        clearInterval(interval);
        timerElement.textContent = '2:00'; // Restablecer el texto del cronómetro
        startButton.disabled = false;
        localStorage.removeItem('startTime'); // Eliminar el tiempo de inicio
      }
    }, 1000);
  }
});

  </script>
</body>
</html>
